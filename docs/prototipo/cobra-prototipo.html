<title>Cobra Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — top bar, content column + sticky side panel (desktop) / bottom sheet + tab bar (phone). Reference: seuimposto.com, own identity. */
:root {
  --done: #2e7d4f;
  --exec: #0f7f83;
  --stop: #b42346;
  --idle: #8a8b84;
  --bg: #efeee9;
  --surface: #f8f7f3;
  --surface-2: #e6e4dd;
  --line: #d8d5cc;
  --fg: #1b1c1a;
  --muted: #62645e;
  --accent: #1f2b24;
  --accent-fg: #f8f7f3;
  --yes: #0f7f83;
  --no: #b8711a;
  --other: #a3a39b;
  --wa: #1fae5b;
  --focus: #2a6df4;
  --shadow: 0 1px 2px rgb(30 30 20 / 6%), 0 8px 24px rgb(30 30 20 / 8%);
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px;
  --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121311; --surface: #1b1c1a; --surface-2: #262724; --line: #33352f;
    --fg: #ecebe6; --muted: #a2a49c; --accent: #e9ece6; --accent-fg: #141512;
    --yes: #3cb6b8; --no: #e0a04a; --other: #6d6f68; --wa: #2bc46b; --focus: #7aa5ff;
    --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 35%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121311; --surface: #1b1c1a; --surface-2: #262724; --line: #33352f;
  --fg: #ecebe6; --muted: #a2a49c; --accent: #e9ece6; --accent-fg: #141512;
  --yes: #3cb6b8; --no: #e0a04a; --other: #6d6f68; --wa: #2bc46b; --focus: #7aa5ff;
  --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 35%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px; height: 60px; max-width: 1360px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; background: none; border: 0; padding: 0; }
.brand svg { width: 26px; height: 26px; }
.brand small { font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; border: 1px solid var(--line); border-radius: var(--r-pill); padding: 1px 7px; }
.seg { display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; margin-left: 12px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: var(--r-pill); font-weight: 500; color: var(--muted); }
.seg button[aria-current="page"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.seg button .soon { font-size: 10px; margin-left: 4px; opacity: .7; }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 18px; height: 18px; }
a.btn { text-decoration: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; font-weight: 600; }
.btn svg { width: 17px; height: 17px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.wa { background: var(--wa); color: #fff; border-color: var(--wa); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.notice { max-width: 1360px; margin: 10px auto 0; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.notice b { color: var(--fg); font-weight: 600; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--no); flex: none; }

/* Shell */
.shell { max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; padding-block: 16px 110px; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 28px; }
.eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.hero h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(32px, 4.4vw, 52px); line-height: 1.04; letter-spacing: -0.015em; margin-top: 10px; }
.hero h1 em { font-style: normal; color: var(--yes); }
.hero p.lead { color: var(--muted); font-size: 16.5px; margin-top: 14px; max-width: 46ch; }
.search { margin-top: 22px; display: flex; gap: 8px; background: var(--surface); border: 1.5px solid var(--fg); border-radius: var(--r-pill); padding: 6px 6px 6px 18px; max-width: 520px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; font-size: 16px; outline: none; }
.search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.hint button { border: 0; background: none; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.examples { position: relative; height: 340px; overflow: hidden; }
.ex { position: absolute; width: 189px; height: 336px; }
.ex > .sc { transform: scale(.7); transform-origin: top left; }
.ex:nth-child(1) { left: 2%; top: 18px; transform: rotate(-6deg); }
.ex:nth-child(2) { left: calc(50% - 95px); top: 0; z-index: 2; }
.ex:nth-child(3) { right: 2%; top: 20px; transform: rotate(6deg); }

.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-h h2 { font-family: var(--f-display); font-weight: 500; font-size: 28px; letter-spacing: -0.01em; }
.section-h p { color: var(--muted); font-size: 13.5px; }

/* Map (IBGE state boundaries) */
.mapbox { position: relative; }
.map-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: var(--r-pill); padding: 4px 6px; font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 3px 8px; border-radius: var(--r-pill); color: var(--muted); }
.crumbs button:hover { color: var(--fg); }
.crumbs b { padding: 3px 8px 3px 2px; }
.crumbs svg { width: 12px; height: 12px; color: var(--muted); }
.modes { margin-left: auto; display: flex; gap: 2px; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; }
.modes button { border: 0; background: none; border-radius: var(--r-pill); padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.map { width: 100%; height: auto; aspect-ratio: 1110 / 971; max-height: 72vh; display: block; touch-action: manipulation; }
.map .uf { stroke: var(--surface); stroke-width: 1.2; vector-effect: non-scaling-stroke; cursor: pointer; transition: opacity .25s ease, filter .15s ease; }
.map .uf:hover { filter: brightness(.93) saturate(1.1); }
.map .uf.sel { stroke: var(--fg); stroke-width: 2.4; }
.map.zoomed .uf:not(.sel) { opacity: .28; }
.map .lab { font: 700 17px var(--f-ui); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; fill: var(--fg); }
.map .lab .pc { font-size: 13px; font-weight: 600; }
.map .call rect { fill: var(--surface); stroke: var(--line); }
.map .call { cursor: pointer; }
.map .call text { font: 700 15px var(--f-ui); fill: var(--fg); }
.map .call line { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.map.zoomed .lab, .map.zoomed .call { display: none; }
.map.zoomed .lab.sel-lab { display: inline; }
.zoombtns { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoombtns button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12.5px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 5; }
.tip b { font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.ramp { display: flex; height: 8px; border-radius: 4px; overflow: hidden; width: 140px; }

/* Representatives grid */
.group h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; gap: 10px; align-items: center; }
.group h3 span { letter-spacing: 0; text-transform: none; font-weight: 500; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.rep { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.rep:hover { border-color: var(--fg); }
.rep[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.rep .who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rep .name { font-weight: 650; font-size: 14.5px; line-height: 1.2; }
.rep .meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.photo { width: 100%; aspect-ratio: 4 / 4.2; border-radius: 12px; position: relative; overflow: hidden; }
.photo svg { width: 100%; height: 100%; display: block; }
.flag { position: absolute; left: 8px; top: 8px; width: 28px; height: 20px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1.5px rgb(255 255 255 / 85%); }
.flag svg { width: 100%; height: 100%; display: block; }
.party { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 11.5px; border-radius: 6px; padding: 2px 7px; color: #fff; letter-spacing: .02em; }
.where { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.explain { font-size: 13.5px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* Panel content */
.p-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; }
.p-head .avatar { width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex: none; position: relative; }
.p-head .avatar svg { width: 100%; height: 100%; }
.p-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.p-head .sub { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.p-close { margin-left: auto; align-self: start; }
.p-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 18px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--bg); border-radius: 12px; padding: 12px; }
.kpi .v { font-size: 26px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
.kpi .v small { font-size: 14px; font-weight: 600; }
.kpi .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--fg); }
.bar > i { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--muted); }
.lbl { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.vote-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.vote-row:first-of-type { border-top: 0; }
.vote-row .t { font-size: 13.5px; font-weight: 550; line-height: 1.3; }
.vote-row .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chip { flex: none; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill); border: 1.5px solid currentColor; }
.chip.yes { color: var(--yes); } .chip.no { color: var(--no); } .chip.other { color: var(--muted); }
.src { font-size: 11.5px; color: var(--muted); }
.p-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.p-empty { padding: 28px 22px; display: flex; flex-direction: column; gap: 10px; color: var(--muted); }
.p-empty h2 { font-family: var(--f-display); font-weight: 500; font-size: 24px; color: var(--fg); }
.partybars { display: flex; flex-direction: column; gap: 7px; }
.p-nav { display: flex; gap: 6px; margin-left: auto; align-self: start; }
.back { border: 0; background: none; padding: 0; font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.back:hover { color: var(--fg); }
.peoplegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.person { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.person:hover { border-color: var(--fg); }
.person .ph { aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
.person .ph svg { width: 100%; height: 100%; display: block; }
.person .nm { font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .party { font-size: 9.5px; padding: 1px 5px; align-self: flex-start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pb { display: grid; grid-template-columns: 90px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 12.5px; }
.pb .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.pb .track span { display: block; height: 100%; border-radius: 5px; }

/* Votes */
.votelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.vcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.vcard:hover { border-color: var(--fg); }
.vcard .house { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.status { font-weight: 700; font-size: 11.5px; }
.status.ok { color: var(--yes); } .status.ko { color: var(--no); }
.vcard h3 { font-family: var(--f-display); font-weight: 500; font-size: 20px; line-height: 1.15; }
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; height: 100%; }
.counts { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); }
.counts b { color: var(--fg); }

.vote-hero { display: flex; flex-direction: column; gap: 14px; }
.vote-hero h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 3.6vw, 42px); line-height: 1.08; letter-spacing: -0.01em; }
.bigsplit { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.bigsplit .n { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.bigsplit .n small { display: block; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.bigsplit .yes { color: var(--yes); } .bigsplit .no { color: var(--no); text-align: right; }
.bigbar { position: relative; display: flex; height: 22px; border-radius: 11px; overflow: hidden; background: var(--surface-2); }
.bigbar span { height: 100%; }
.bigbar i { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; background: var(--fg); }
.summary { font-size: 15.5px; max-width: 68ch; }
.badge-ai { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 3px 10px; }
.myvotes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.myvote { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 12px; padding: 8px; text-align: left; border: 1px solid transparent; }
.myvote:hover { border-color: var(--line); }
.myvote .mini { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex: none; }
.myvote .mini svg { width: 100%; height: 100%; }
.myvote .nm { font-size: 13px; font-weight: 600; line-height: 1.2; }
.myvote .pt { font-size: 11.5px; color: var(--muted); }
.myvote .chip { margin-left: auto; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

/* Bottom tab bar (phone) */
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-in { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--fg); font-weight: 650; }

/* Sheet / modal */
.scrim { position: fixed; inset: 0; background: rgb(10 10 8 / 45%); z-index: 40; }
.sheet { position: fixed; z-index: 41; background: var(--surface); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.sheet.share { right: max(20px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 70px); width: 400px; max-height: calc(100vh - 90px); border-radius: 20px; border: 1px solid var(--line); overflow: auto; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
.sheet-h h2 { font-size: 16px; font-weight: 700; }
.handle { display: none; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.formats { display: flex; gap: 4px; margin: 4px 16px 10px; background: var(--surface-2); border-radius: var(--r-pill); padding: 3px; }
.formats button { flex: 1; border: 0; background: none; border-radius: var(--r-pill); padding: 6px 0; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.formats button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.preview { margin: 0 16px; display: grid; place-items: center; background: var(--bg); border-radius: 14px; padding: 14px; }
.share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 16px 18px; }
.share-actions .wa { grid-column: 1 / -1; padding: 13px; font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--r-pill); font-size: 13.5px; font-weight: 600; z-index: 60; }

/* Share card (rendered at design size, scaled in preview) */
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; color: var(--fg); }
.sc-in { padding: 18px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
.sc-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
.sc-top b { font-size: 15px; color: var(--fg); font-weight: 800; letter-spacing: -0.02em; }

<script>
(() => {
  // ---------------------------------------------------------------- data
  const PARTIES = {
    PT: ["Partido dos Trabalhadores", "#c8102e"], PL: ["Partido Liberal", "#1e3a8a"], UNIAO: ["União Brasil", "#0284c7"],
    PP: ["Progressistas", "#2563eb"], PSD: ["Partido Social Democrático", "#d97706"], MDB: ["Movimento Democrático Brasileiro", "#15803d"],
    PSB: ["Partido Socialista Brasileiro", "#ea580c"], PSOL: ["Partido Socialismo e Liberdade", "#a16207"], NOVO: ["Partido Novo", "#f97316"],
    REPUBLICANOS: ["Republicanos", "#1d4ed8"], PDT: ["Partido Democrático Trabalhista", "#b91c1c"], PSDB: ["Partido da Social Democracia Brasileira", "#0369a1"],
  };
  const pLabel = (k) => (k === "UNIAO" ? "UNIÃO" : k);
  const UF_TILES = [
    ["RR",0,2],["AP",0,3],["AM",1,1],["PA",1,2],["MA",1,3],["CE",1,4],["RN",1,5],
    ["AC",2,0],["RO",2,1],["TO",2,2],["PI",2,3],["PE",2,4],["PB",2,5],
    ["MT",3,1],["GO",3,2],["DF",3,3],["BA",3,4],["AL",3,5],
    ["MS",4,1],["SP",4,2],["MG",4,3],["ES",4,4],["SE",4,5],
    ["PR",5,2],["RJ",5,3],["SC",6,2],["RS",7,2],
  ];
  const UF_NAMES = { AC:"Acre",AL:"Alagoas",AP:"Amapá",AM:"Amazonas",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",MA:"Maranhão",MT:"Mato Grosso",MS:"Mato Grosso do Sul",MG:"Minas Gerais",PA:"Pará",PB:"Paraíba",PR:"Paraná",PE:"Pernambuco",PI:"Piauí",RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RS:"Rio Grande do Sul",RO:"Rondônia",RR:"Roraima",SC:"Santa Catarina",SP:"São Paulo",SE:"Sergipe",TO:"Tocantins" };
  const SEATS = { AC:8,AL:9,AP:8,AM:8,BA:39,CE:22,DF:8,ES:10,GO:17,MA:18,MT:8,MS:8,MG:53,PA:17,PB:12,PR:30,PE:25,PI:10,RJ:46,RN:8,RS:31,RO:8,RR:8,SC:16,SP:70,SE:8,TO:8 };

  let seed = 20261026;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const FIRST = ["Ana","Bruno","Carla","Diego","Elaine","Fábio","Gisele","Heitor","Íris","João","Kátia","Lucas","Marta","Nelson","Olívia","Paulo","Quitéria","Rafael","Sônia","Tiago","Úrsula","Vítor","Wanda","Yara","Zélia","Caio","Denise","Ruy","Lia","Otávio","Bianca","Mauro","Renata","Hugo","Celina","Arthur"];
  const LAST = ["Andrade","Barbosa","Campos","Duarte","Esteves","Falcão","Guerra","Holanda","Inácio","Jardim","Lacerda","Macedo","Nogueira","Oliva","Prado","Queiroz","Rangel","Salgado","Tavares","Uchoa","Valente","Xavier","Zanetti","Moura","Brandão","Cordeiro"];
  const usedNames = new Set();
  const newName = () => { let n; do { n = `${pick(FIRST)} ${pick(LAST)}`; } while (usedNames.has(n)); usedNames.add(n); return n; };
  const partyKeys = Object.keys(PARTIES);

  const VOTES = [
    { id: "v1", house: "Câmara", date: "22 out 2026", title: "Câmara aprova limite maior de faturamento para microempreendedor", status: "Aprovada", yes: 312, no: 141, other: 9,
      summary: "O projeto fictício sobe o limite de faturamento anual do MEI e cria uma faixa de transição para quem passar do teto. A favor, defensores dizem que mais pessoas saem da informalidade; contra, críticos apontam perda de arrecadação.", criterion: "Placar disputado: diferença entre Sim e Não menor que 20% dos votantes? Não. Tipo de matéria: projeto de lei complementar.", theme: "Economia" },
    { id: "v2", house: "Senado", date: "21 out 2026", title: "Senado rejeita mudança no prazo de pagamento do Imposto de Renda", status: "Rejeitada", yes: 30, no: 41, other: 4,
      summary: "A proposta fictícia permitiria parcelar o IR devido em até 12 vezes sem juros. A favor: alívio no orçamento das famílias. Contra: impacto no caixa do governo no curto prazo.", criterion: "Placar disputado: diferença menor que 20% dos votantes.", theme: "Impostos" },
    { id: "v3", house: "Câmara", date: "15 out 2026", title: "Câmara aprova regras para uso de celular nas escolas", status: "Aprovada", yes: 398, no: 52, other: 12,
      summary: "O texto fictício limita o uso de celulares em sala de aula na educação básica, com exceções para fins pedagógicos e de acessibilidade.", criterion: "Divergência entre orientações de governo e oposição.", theme: "Educação" },
  ];
  const optFor = (vote, party) => {
    const bias = { v1: { PT:-.4, PSOL:-.6, PL:.4, NOVO:.6, PP:.3 }, v2: { PT:.5, PSOL:.6, PL:-.3, NOVO:-.6 }, v3: { NOVO:-.5, PL:-.1 } }[vote.id][party] || 0;
    const pYes = vote.yes / (vote.yes + vote.no + vote.other) + bias * .5;
    const r = rnd();
    return r < .06 ? "other" : r < pYes ? "yes" : "no";
  };
  const makeRep = (office, uf, partyArg) => {
    const party = partyArg || pick(partyKeys);
    const limit = office === "Senador(a)" ? 38000 : office === "Deputado(a) federal" ? 45612 : 25322;
    const spent = Math.round(limit * (0.45 + rnd() * 0.5)) * 10;
    return {
      id: "r" + Math.floor(rnd() * 1e9).toString(36), name: newName(), party, office, uf,
      presence: Math.round(70 + rnd() * 29), houseMedian: office === "Senador(a)" ? 90 : office === "Deputado(a) federal" ? 81 : 85,
      spent, limit: limit * 10, assets: Math.round(200 + rnd() * 4800) * 1000, hue: Math.floor(rnd() * 360),
      votes: Object.fromEntries(VOTES.map((v) => [v.id, office === "Deputado(a) distrital" ? null : optFor(v, party)])),
    };
  };
  const byName = (a, b) => a.name.localeCompare(b.name, "pt-BR");
  const ufYes = Object.fromEntries(UF_TILES.map(([uf]) => [uf, Object.fromEntries(VOTES.map((v) => [v.id, Math.round(30 + rnd() * 55)]))]));
  const ufParties = Object.fromEntries(UF_TILES.map(([uf]) => {
    let left = SEATS[uf]; const rows = [];
    partyKeys.slice().sort(() => rnd() - .5).forEach((k, i) => { if (left <= 0) return; const n = i === 11 ? left : Math.min(left, Math.round(rnd() * SEATS[uf] * .35)); if (n > 0) { rows.push([k, n]); left -= n; } });
    if (left > 0) rows.push(["PSD", left]);
    return [uf, rows.sort((a, b) => pLabel(a[0]).localeCompare(pLabel(b[0])))];
  }));
  // Every state gets 3 senators and its real number of federal seats, split by the fictional party mix above.
  const REPS = Object.fromEntries(UF_TILES.map(([uf]) => [uf, {
    senators: Array.from({ length: 3 }, () => makeRep("Senador(a)", uf)).sort(byName),
    federal: ufParties[uf].flatMap(([k, n]) => Array.from({ length: n }, () => makeRep("Deputado(a) federal", uf, k))).sort(byName),
  }]));
  const DF = { senators: REPS.DF.senators, federal: REPS.DF.federal, district: Array.from({ length: 24 }, () => makeRep("Deputado(a) distrital", "DF")).sort(byName) };
  const ALL = [...Object.values(REPS).flatMap((g) => [...g.senators, ...g.federal]), ...DF.district];

      </section>
      ${v.house === "Câmara" ? `<section class="card"><div class="section-h"><h2>Como votaram os deputados do DF</h2><p>Ordem alfabética</p></div><div class="myvotes" style="margin-top:12px">${DF.federal.map((r) => `<button class="myvote" data-rep="${r.id}"><span class="mini">${portrait(r, { initials: false })}</span><span><span class="nm">${esc(r.name)}</span><br><span class="pt">${pLabel(r.party)} · DF</span></span><span class="chip ${r.votes[v.id]}">${optLabel[r.votes[v.id]]}</span></button>`).join("")}</div></section>` : `<section class="card"><div class="section-h"><h2>Como votaram os senadores do DF</h2></div><div class="myvotes" style="margin-top:12px">${DF.senators.map((r) => `<button class="myvote" data-rep="${r.id}"><span class="mini">${portrait(r, { initials: false })}</span><span><span class="nm">${esc(r.name)}</span><br><span class="pt">${pLabel(r.party)} · DF</span></span><span class="chip ${r.votes[v.id]}">${optLabel[r.votes[v.id]]}</span></button>`).join("")}</div></section>`}
      <div style="display:flex;flex-direction:column;gap:20px">
        <section class="card"><div class="section-h"><h2>Por estado</h2><p>% de Sim entre os deputados de cada estado</p></div><div style="margin-top:12px">${mapHtml("vote")}</div></section>
        <section class="card"><div class="section-h"><h2>Por partido</h2><p>% de Sim · ordem alfabética</p></div><div class="partybars" style="margin-top:14px">${partyRows.map(([k, y]) => `<div class="pb"><span>${partyChip(k)}</span><span class="track"><span style="width:${y}%;background:var(--yes)"></span></span><span>${y}%</span></div>`).join("")}</div></section>
      </div>`;
    if (state.rep) panelRep(state.rep); else if (state.uf) panelUF(state.uf); else panelEmpty("Toque num estado ou num deputado", "Veja o placar daquele estado ou o histórico de votos do político.");
  };

  // ---------------------------------------------------------------- panel
  const panelShell = (inner) => { panel.innerHTML = `<div class="handle"></div>${inner}`; };
  const closeBtn = `<button class="icon-btn p-close" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
  const panelEmpty = (h, p) => { panel.classList.remove("open"); panelShell(`<div class="p-empty"><h2>${h}</h2><p>${p}</p></div>`); };
  const panelRep = (r) => {
    const pctSpent = Math.round(r.spent / r.limit * 100);
    panelShell(`${state.uf ? `<div style="padding:14px 18px 0"><button class="back" data-back-uf>‹ Voltar para ${UF_NAMES[state.uf]}</button></div>` : ""}<div class="p-head"><div class="avatar">${portrait(r, { initials: false })}<span class="flag" style="width:22px;height:15px;left:4px;top:4px">${flagFor(r.uf)}</span></div>
        <div><h2>${esc(r.name)}</h2><div class="sub">${partyChip(r.party)}<span>${esc(r.office)} · ${UF_NAMES[r.uf]}</span></div></div>${closeBtn}</div>
      <div class="p-body">
        <div class="kpis">
          <div class="kpi"><div class="v">${r.presence}<small>%</small></div><div class="l">presença nas votações do plenário</div><div class="bar"><span style="width:${r.presence}%"></span><i style="left:${r.houseMedian}%"></i></div><div class="src" style="margin-top:6px">mediana da casa: ${r.houseMedian}%</div></div>
          <div class="kpi"><div class="v" style="font-size:22px">${brl(r.spent)}</div><div class="l">gastos da cota em 2026</div><div class="bar"><span style="width:${pctSpent}%"></span></div><div class="src" style="margin-top:6px">${pctSpent}% do limite anual</div></div>
        </div>
        ${r.office === "Deputado(a) distrital" ? `<p class="explain">Votações da CLDF chegam na fase 2. Por enquanto, o perfil básico mostra cadastro e partido.</p>` : `<div><p class="lbl">Últimos votos</p>${VOTES.filter((v) => r.votes[v.id] && ((r.office === "Senador(a)") === (v.house === "Senado"))).map((v) => `<div class="vote-row"><span class="chip ${r.votes[v.id]}">${optLabel[r.votes[v.id]]}</span><div><div class="t">${esc(v.title)}</div><div class="d">${v.house} · ${v.date}</div></div></div>`).join("") || `<p class="src">Sem votações nominais recentes.</p>`}</div>`}
        <div class="kpi"><div class="v" style="font-size:22px">${brl(r.assets)}</div><div class="l">patrimônio declarado ao TSE na última eleição</div></div>
        <p class="src">Fontes: Câmara dos Deputados, Senado Federal, CLDF e TSE · atualizado em 26/10/2026</p>
        <div class="p-actions"><button class="btn primary" data-share="rep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>Compartilhar</button><button class="btn" data-profile="${r.id}">Ver perfil completo</button><button class="btn" disabled>Seguir</button></div>
      </div>`);
    panel.classList.add("open");
  };
  const person = (r) => {
    const v = state.view === "votacao" ? r.votes[state.vote] : null;
    return `<button class="person" data-rep="${r.id}"><span class="ph">${portrait(r, { initials: false })}</span><span class="nm">${esc(r.name)}</span>${v ? `<span class="chip ${v}" style="font-size:10px;padding:1px 6px;align-self:flex-start">${optLabel[v]}</span>` : partyChip(r.party)}</button>`;
  };
  const panelUF = (uf) => {
    const rows = ufParties[uf]; const max = Math.max(...rows.map((r) => r[1])); const [tk, tn] = topParty(uf);
    const i = UF_ORDER.indexOf(uf); const prev = UF_ORDER[(i + UF_ORDER.length - 1) % UF_ORDER.length]; const next = UF_ORDER[(i + 1) % UF_ORDER.length];
    const v = VOTES.find((x) => x.id === state.vote);
    panelShell(`<div class="p-head"><div class="avatar" style="width:52px;height:36px;border-radius:6px">${flagFor(uf)}</div><div><h2>${UF_NAMES[uf]}</h2><div class="sub">${uf} · ${SEATS[uf]} deputados federais · 3 senadores</div></div>
        <div class="p-nav"><button class="icon-btn" data-uf="${prev}" aria-label="Estado anterior: ${UF_NAMES[prev]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button><button class="icon-btn" data-uf="${next}" aria-label="Próximo estado: ${UF_NAMES[next]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button><button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
      <div class="p-body">
        ${state.view === "votacao"
          ? `<div class="kpi"><div class="v">${ufYes[uf][state.vote]}<small>% Sim</small></div><div class="l">dos deputados de ${UF_NAMES[uf]} em “${esc(v.title)}”</div></div>`
          : `<div class="statrow"><div class="kpi"><div class="v">${SEATS[uf]}</div><div class="l">deputados federais</div></div><div class="kpi"><div class="v">3</div><div class="l">senadores</div></div><div class="kpi"><div class="v" style="font-size:20px">${pLabel(tk)}</div><div class="l">maior bancada (${tn})</div></div></div>`}
        <div><p class="lbl">Senadores · ordem alfabética</p><div class="peoplegrid">${REPS[uf].senators.map(person).join("")}</div></div>
        <div><p class="lbl">Deputados federais · ordem alfabética</p><div class="peoplegrid">${REPS[uf].federal.map(person).join("")}</div></div>
        <div><p class="lbl">Bancada federal por partido · ordem alfabética</p><div class="partybars" style="margin-top:10px">${rows.map(([k, n]) => `<div class="pb"><span>${partyChip(k)}</span><span class="track"><span style="width:${n / max * 100}%;background:${PARTIES[k][1]}"></span></span><span>${n}</span></div>`).join("")}</div></div>
        ${uf === "DF" ? `<button class="btn primary" data-go="representantes">Ver também os 24 deputados distritais</button>` : ""}
        <p class="src">Fonte: Câmara dos Deputados e Senado Federal · atualizado em 26/10/2026</p>
      </div>`);
    panel.classList.add("open"); panel.scrollTop = 0;
  };

  // ---------------------------------------------------------------- share sheet
  const openShare = (kind) => {
    state.shareOpen = kind;
    const draw = () => {
      const scale = state.format === "link" ? 0.94 : state.format === "feed" ? 0.92 : 0.82;
      layer.innerHTML = `<div class="scrim" data-close-share></div><div class="sheet share" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><div class="handle"></div>
        <div class="sheet-h"><h2 id="shareTitle">Compartilhar</h2><button class="icon-btn" data-close-share aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
        <div class="formats" role="group" aria-label="Formato">${[["story", "Stories 9:16"], ["feed", "Feed 4:5"], ["link", "Prévia de link"]].map(([k, l]) => `<button data-format="${k}" aria-pressed="${state.format === k}">${l}</button>`).join("")}</div>
        <div class="preview"><div style="transform:scale(${scale});transform-origin:top center;height:${({ story: 480, feed: 375, link: 189 })[state.format] * scale}px">${shareCard(kind, state.format)}</div></div>
        <div class="share-actions">
          <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent("Veja quem representa Ceilândia (DF): https://cobra.org.br/representantes/5300108")}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.9c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.8.9c.3.1.4.2.5.3.1.2.1.7-.2 1.4z"/></svg>Enviar no WhatsApp</a>
          <button class="btn" data-fake="A imagem é gerada no site real">Baixar imagem</button>
          <button class="btn" data-fake="A imagem é copiada no site real">Copiar imagem</button>
          <a class="btn" href="https://x.com/intent/post?text=${encodeURIComponent("Veja quem representa Ceilândia (DF) https://cobra.org.br/representantes/5300108")}" target="_blank" rel="noopener">Postar no X</a>
          <button class="btn" data-copy>Copiar link</button>
        </div></div>`;
      layer.querySelector('[data-close-share].icon-btn').focus();
    };
    draw();
    layer.onclick = (e) => {
      const f = e.target.closest("[data-format]"); if (f) { state.format = f.dataset.format; draw(); return; }
      if (e.target.closest("[data-close-share]")) { layer.innerHTML = ""; state.shareOpen = false; if (state.view === "perfil") state.rep = null; return; }
      const fake = e.target.closest("[data-fake]"); if (fake) { toast(fake.dataset.fake); return; }
      if (e.target.closest("[data-copy]")) {
        const link = "https://cobra.org.br/representantes/5300108";
        navigator.clipboard?.writeText(link).then(() => toast("Link copiado"), () => toast(link));
      }
    };
  };

  // ---------------------------------------------------------------- routing
  const render = () => {
    document.querySelectorAll("[data-go]").forEach((b) => b.toggleAttribute("aria-current", false));
    document.querySelectorAll(`.seg [data-go="${state.view}"], .tabbar [data-go="${state.view}"]`).forEach((b) => b.setAttribute("aria-current", "page"));
    document.body.classList.toggle("nopanel", state.view === "perfil");
    if (state.view === "inicio") renderHome(); else if (state.view === "representantes") renderReps(); else if (state.view === "perfil") renderProfile(); else if (state.view === "obras") renderObras(); else renderVote();
    animateMap(); bindMapTip();
  };
  // Selecting a person only swaps the panel, so the map keeps its zoom.
  const renderPanelOnly = () => { if (state.rep) panelRep(state.rep); else render(); };
  const go = (view) => { state.view = view; state.rep = null; state.uf = null; state.obra = null; currentVB = FULL_VB.slice(); try { history.replaceState(null, "", "#" + view); } catch {} render(); window.scrollTo({ top: 0 }); };

  document.addEventListener("click", (e) => {
    const t = e.target;
    const goBtn = t.closest("[data-go]"); if (goBtn && !goBtn.disabled) { go(goBtn.dataset.go); return; }
    if (t.closest("#brand")) { go("inicio"); return; }
    if (t.closest("#ex")) { state.place = "Ceilândia (DF)"; go("representantes"); return; }
    const tile = t.closest("[data-uf]"); if (tile) { state.uf = tile.dataset.uf; state.rep = null; render(); return; }
    if (t.closest("[data-map-reset]")) { state.uf = null; state.rep = null; render(); return; }
    if (t.closest("[data-back-uf]")) { state.rep = null; render(); return; }
    const mm = t.closest("[data-map-mode]"); if (mm) { state.mapMode = mm.dataset.mapMode; render(); return; }
    const z = t.closest("[data-zoom]"); if (z) {
      const svg = main.querySelector("svg.map"); const [x, y, w, h] = currentVB; const f = z.dataset.zoom === "in" ? 0.7 : 1 / 0.7;
      const nw = Math.min(FULL_VB[2] * 1.2, Math.max(60, w * f)); const nh = h * (nw / w);
      currentVB = [x + (w - nw) / 2, y + (h - nh) / 2, nw, nh]; svg.setAttribute("viewBox", currentVB.join(" ")); svg.dataset.target = currentVB.join(" "); return;
    }
    const rep = t.closest("[data-rep]"); if (rep) { state.rep = ALL.find((r) => r.id === rep.dataset.rep); renderPanelOnly(); return; }
    const vote = t.closest("[data-vote]"); if (vote) { state.vote = vote.dataset.vote; state.view = "votacao"; state.rep = null; render(); window.scrollTo({ top: 0 }); return; }
    if (t.closest("[data-close]") && state.obra) { state.obra = null; render(); return; }
    if (t.closest("[data-close]")) { if (state.rep && state.uf) { state.rep = null; render(); } else { state.rep = null; state.uf = null; render(); } return; }
    const prof = t.closest("[data-profile]"); if (prof) { state.profileRep = ALL.find((x) => x.id === prof.dataset.profile); state.view = "perfil"; state.tab = "votos"; state.themeF = null; state.rep = null; state.uf = null; panel.classList.remove("open"); render(); window.scrollTo({ top: 0 }); return; }
    const tabB = t.closest("[data-tab]"); if (tabB) { state.tab = tabB.dataset.tab; render(); return; }
    const thF = t.closest("[data-theme-f]"); if (thF) { state.themeF = thF.dataset.themeF; render(); return; }
    if (t.closest("[data-homage]")) { state.showHomage = !state.showHomage; render(); return; }
    const sf = t.closest("[data-sit-f]"); if (sf) { state.obraF.sit = sf.dataset.sitF; render(); return; }
    const af = t.closest("[data-area-f]"); if (af) { state.obraF.area = af.dataset.areaF; render(); return; }
    const ob = t.closest("[data-obra]"); if (ob) { state.obra = OBRAS.find((o) => o.id === ob.dataset.obra); if (state.view !== "obras") { state.view = "obras"; } render(); return; }
    const share = t.closest("[data-share]"); if (share) { let k = share.dataset.share; if (k === "profile") { state.rep = state.profileRep; k = "rep"; } openShare(k); return; }
    if (t.closest("#shareTop")) { if (state.view === "perfil") state.rep = state.profileRep; openShare(state.view === "votacao" ? "vote" : state.view === "obras" && state.obra ? "obra" : state.rep ? "rep" : "places"); return; }
    if (t.closest("#theme")) {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
    }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "cepForm") return;
    e.preventDefault();
    const v = document.getElementById("cep").value.trim();
    state.place = /^\d{5}-?\d{3}$/.test(v) || /ceil/i.test(v) || v === "" ? "Ceilândia (DF)" : `${v} (exemplo com dados do DF)`;
    go("representantes");
  });
  document.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("path.uf")) { e.preventDefault(); state.uf = e.target.dataset.uf; state.rep = null; render(); return; } if (e.key === "Escape") { if (state.shareOpen) { layer.innerHTML = ""; state.shareOpen = false; } else if (state.rep || state.uf) { state.rep = null; state.uf = null; render(); } } });

  const initial = (location.hash || "").slice(1);
  state.view = ["inicio", "representantes", "votacao", "obras"].includes(initial) ? initial : "inicio";
  if (state.view === "representantes") state.place = "Ceilândia (DF)";
  render();
})();
</script>
