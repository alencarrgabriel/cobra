version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js major in .nvmrc (24); bump both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint (used by eslint-config-next) does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /collectors
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
