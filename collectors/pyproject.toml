[project]
name = "cobra-collectors"
version = "0.1.0"
description = "Coletores de dados oficiais do Cobra (Câmara, Senado, TSE, CLDF)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.16.1",
    "structlog>=26.1.0",
    "typer>=0.27.3",
]

[project.scripts]
cobra-collect = "cobra_collectors.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PTH", "DTZ", "T20", "PL",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests never reach the network (spec verificacao-continua); unix sockets stay allowed.
addopts = "--disable-socket --allow-unix-socket --strict-markers"
